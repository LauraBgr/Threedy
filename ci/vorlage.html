<body>
<header>

  <nav id="nav"></nav>
</header>
<main id="inhalt"></main>
<div id="tip" role="tooltip"></div>
<script>
const D = /*DATEN*/null;
const $ = (s) => document.querySelector(s);
function el(tag, attrs = {}, ...k) {
  const e = document.createElement(tag);
  for (const [a, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (a === "class") e.className = v; else if (a === "style") e.style.cssText = v; else if (a.startsWith("on")) e.addEventListener(a.slice(2), v); else e.setAttribute(a, v); }
  for (const x of k.flat(Infinity)) if (x != null && x !== false) e.append(x);
  return e;
}
function svg(tag, attrs = {}, ...k) { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [a, v] of Object.entries(attrs)) e.setAttribute(a, v); for (const x of k.flat(Infinity)) if (x != null) e.append(x); return e; }

// ---------- Tooltip ----------
const tipEl = $("#tip");
function tip(node, titel, zeilen = []) {
  const zeige = (ev) => { tipEl.replaceChildren(el("b", {}, titel), ...zeilen.map((z) => el("div", {}, z))); tipEl.style.display = "block"; pos(ev); };
  const pos = (ev) => { const r = tipEl.getBoundingClientRect(); let x = (ev.clientX ?? node.getBoundingClientRect().right) + 14, y = (ev.clientY ?? node.getBoundingClientRect().top) + 14;
    if (x + r.width > innerWidth - 8) x = innerWidth - r.width - 8; if (y + r.height > innerHeight - 8) y = y - r.height - 28; tipEl.style.left = x + "px"; tipEl.style.top = y + "px"; };
  node.addEventListener("mouseenter", zeige); node.addEventListener("mousemove", pos); node.addEventListener("mouseleave", () => (tipEl.style.display = "none"));
  node.addEventListener("focus", zeige); node.addEventListener("blur", () => (tipEl.style.display = "none"));
  if (!node.hasAttribute("tabindex")) node.setAttribute("tabindex", "0");
  return node;
}

// ---------- Labels (internal keys are German) ----------
const THEMES = { browserbasiert: "Browser-based", streaming_grosser_daten: "Streaming large data", multi_cad_formate: "Multi-CAD formats", design_review: "Design review",
  zusammenarbeit: "Collaboration", digitaler_zwilling: "Digital twin", ki_und_agenten: "AI & agents", ar_vr: "AR/VR", service_und_wartung: "Service & maintenance",
  fertigung_und_produktion: "Manufacturing", vertrieb_und_marketing: "Sales & marketing", plm_integration: "PLM integration", sdk_und_api: "SDK & API",
  cloud_und_saas: "Cloud & SaaS", sicherheit_und_datenschutz: "Security & privacy", skalierbarkeit_enterprise: "Enterprise scale", nachhaltigkeit: "Sustainability", kosten_und_roi: "Cost & ROI" };
const CTAS = { demo: "Demo", testversion: "Free trial", kontakt_vertrieb: "Contact sales", video: "Video", dokumentation: "Documentation", download: "Download", event: "Event", preise: "Pricing", newsletter: "Newsletter", sonstiges: "Other" };
const PAGETYPES = { startseite: "Homepage", produkt: "Product", loesung: "Solution", branche: "Industry", preis: "Pricing", vergleich: "Comparison", presse: "Press", blog: "Blog", sonstiges: "Other" };
const EVENTS = { produkt: "Product", partnerschaft: "Partnership", kunde: "Customer", finanzierung: "Funding", uebernahme: "Acquisition", personal: "People", event: "Event", studie: "Study", sonstiges: "Other" };
const STATUS = { luecke: ["!", "Gap"], schwach: ["▼", "Under-weighted"], staerke: ["✓", "Strength"], gleichauf: ["=", "At parity"], offen: ["○", "Open field"],
  hoch: ["!", "High"], mittel: ["•", "Medium"], niedrig: ["·", "Low"], aufgenommen: ["✓", "Now monitored"], beobachtet: ["○", "Watching"], ausgeschlossen: ["✕", "Excluded"] };
const KINDS = { wettbewerber: "Competitor", partner: "Partner", kunde: "Customer", investor: "Investor", sonstiges: "Other" };
const CHANGES = { "neu erfasst": "First captured", "geändert": "Changed", "neue Seite": "New page" };
const PROOFS = { kundenlogos: "Customer logos", fallstudie: "Case studies", zahlen: "Quantified claims", zertifikat: "Certifications", auszeichnung: "Awards", partner: "Partners",
  enterprise: "Enterprise claims", sicherheit: "Security language", technische_tiefe: "Technical depth", roi: "ROI framing" };
const TONES = { technisch: "Technical", nutzen_und_roi: "Benefit & ROI", visionaer: "Visionary", vertrauen_und_sicherheit: "Trust & security", einfach_und_zugaenglich: "Simple & accessible" };
const THEMA = (t) => THEMES[t] || t.replace(/_/g, " ");
const status = (s) => el("span", { class: "status s-" + s }, el("i", {}, (STATUS[s] || ["?"])[0]), (STATUS[s] || [s, s])[1]);
const region = (r) => el("span", { class: "region " + (r || "") }, r || "own site");
const pct = (x) => Math.round(x * 100) + "%";
const FEHLER = (f) => f.replace("robots.txt verbietet den Abruf", "blocked by robots.txt").replace("kaum Text auf der Seite (evtl. nur per JavaScript geladen)", "almost no text (content probably loaded via JavaScript)");
const ersatz = D.modus.startsWith("Ersatz");
const modus = ersatz ? "keyword fallback (no AI)" : D.modus.replace(/^KI/, "AI");
const datum = (s) => { const d = new Date(s); return isNaN(d) ? String(s).replace("T", " ") : d.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }); };
const heute = new Date().toISOString().slice(0, 10);
const tageZurueck = (n) => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);

// ---------- Data prep ----------
const alleFirmen = D.firmen.filter((f) => f.seiten.length || (f.news || []).length);
const firmen = D.firmen.filter((f) => f.seiten.length);
const ref = firmen.find((f) => f.referenz);
const L = D.luecken || {};
const R = D.radar || { kandidaten: [] };
const M = D.markt || { artikel: [], analyse: {} };
const alleArtikel = [...alleFirmen.flatMap((f) => (f.news || []).map((a) => ({ ...a, firma: f.name, firmaRegion: f.region }))), ...M.artikel.map((a) => ({ ...a, firma: "Market" }))];
const presseArtikel = alleArtikel.filter((a) => a.herkunft !== "Website");
const neueArtikel = alleArtikel.filter((a) => a.neu).length;
const luecken = (L.themen_tabelle || []).filter((z) => z.status === "luecke" || z.status === "schwach");
const gefaehrlich = R.kandidaten.filter((k) => k.gefahr >= 4 && k.status !== "ausgeschlossen");

$("#stand").textContent = `Updated ${datum(D.erstellt)} · ${firmen.length} companies · ${firmen.reduce((a, f) => a + f.seiten.length, 0)} pages · ${alleArtikel.length} articles · Analysis: ${modus}`;

// ---------- Reusable charts ----------
function kacheln(liste) {
  return el("div", { class: "kacheln" }, liste.map(([wert, name, hinw]) => el("div", { class: "kachel" }, el("div", { class: "wert" }, String(wert)), el("div", { class: "name" }, name), hinw ? el("div", { class: "hinw" }, hinw) : null)));
}
function balken(zeilen, { max, fmt = (v) => String(v), farbe = () => "var(--accent)", tipp } = {}) {
  const m = max ?? Math.max(1, ...zeilen.map((z) => z.wert));
  return el("div", {}, zeilen.map((z) => {
    const row = el("div", { class: "balken" }, el("span", { class: "lab" + (z.fett ? " fett" : "") }, z.label),
      el("span", { class: "spur" }, el("i", { style: `width:${Math.max(z.wert ? 1.5 : 0, 100 * z.wert / m)}%;background:${farbe(z)}` })), el("span", { class: "wert" }, fmt(z.wert)));
    return tipp ? tip(row, z.label, tipp(z)) : row;
  }));
}
function hantel(zeilen, { a, b }) {
  // zeilen: {label, x, y} with x,y in 0..1; a/b: {name, farbe}
  const achse = () => el("div", { class: "achse" }, [0, .25, .5, .75, 1].map((t) => el("span", { style: `left:${t * 100}%` }, pct(t))));
  const kopf = el("div", { class: "hantel" }, el("span"), achse(), el("span", { class: "klein", style: "text-align:right" }, "gap"));
  return el("div", {}, el("div", { class: "legende" }, el("span", {}, el("b", { style: `background:${a.farbe}` }), a.name), el("span", {}, el("b", { style: `background:${b.farbe}` }), b.name)),
    kopf, el("div", { class: "hantel" }, zeilen.map((z) => {
