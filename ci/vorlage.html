<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competitive Intelligence · Threedy</title>
<style>
  :root { --bg: #F4F5F8; --karte: #FFFFFF; --text: #1E2230; --leise: #6B7080; --linie: #E3E5EC; --akzent: #2F6FEB; --eu: #2F6FEB; --us: #E0663A; --gut: #2E9C6A; --warn: #C98A12; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: #161A26; color: #fff; padding: 22px 24px 0; }
  header h1 { margin: 0; font-size: 22px; } header p { margin: 4px 0 14px; color: #B5BAC8; font-size: 13px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { background: none; border: 0; color: #B5BAC8; font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; }
  nav button.an { background: var(--bg); color: var(--text); }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .karte { background: var(--karte); border: 1px solid var(--linie); border-radius: 12px; padding: 16px; min-width: 0; }
  .karte h3 { margin: 0 0 4px; font-size: 16px; }
  h2 { font-size: 18px; margin: 4px 0 12px; }
  .klein { color: var(--leise); font-size: 12.5px; }
  .region { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; color: #fff; }
  .region.EU { background: var(--eu); } .region.USA { background: var(--us); }
  .ref { background: #161A26; color: #fff; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; margin-left: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { background: #EEF2FB; color: #30415F; border-radius: 6px; padding: 1px 7px; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; background: var(--karte); border: 1px solid var(--linie); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linie); vertical-align: top; font-size: 13px; }
  th { background: #F7F8FB; font-size: 12px; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; }
  .tabwrap { overflow-x: auto; border-radius: 12px; }
  td.zelle { text-align: center; font-weight: 600; min-width: 56px; }
  .hinweis { background: #FFF7E6; border: 1px solid #F3D9A4; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; }
  .md h2 { font-size: 15px; margin: 14px 0 4px; } .md p, .md li { font-size: 14px; }
  .balken { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 3px 0; }
  .balken .spur { flex: 1; height: 10px; background: #EEF0F5; border-radius: 99px; overflow: hidden; display: flex; }
  .balken i { display: block; height: 100%; }
  input[type=search], select { font: inherit; padding: 7px 10px; border: 1px solid var(--linie); border-radius: 8px; background: #fff; }
  a { color: var(--akzent); text-decoration: none; } a:hover { text-decoration: underline; }
  .leer { color: var(--leise); }
</style>
</head>
<body>
<header>
  <h1>Competitive Intelligence · Threedy</h1>
  <p id="stand"></p>
  <nav id="nav"></nav>
</header>
<main id="inhalt"></main>
<script>
const D = /*DATEN*/null;
const $ = (s) => document.querySelector(s);
function el(tag, attrs = {}, ...k) { const e = document.createElement(tag); for (const [a, v] of Object.entries(attrs)) { if (v == null) continue; if (a === "class") e.className = v; else if (a.startsWith("on")) e.addEventListener(a.slice(2), v); else e.setAttribute(a, v); } for (const x of k) if (x != null) e.append(x); return e; }
const THEMA = (t) => t.replace(/_/g, " ").replace("ki und agenten", "KI & Agenten").replace("ar vr", "AR/VR").replace("sdk und api", "SDK & API").replace("plm integration", "PLM-Integration");
const firmen = D.firmen.filter((f) => f.seiten.length);
const region = (r) => el("span", { class: "region " + r }, r);
$("#stand").textContent = `Stand ${D.erstellt.replace("T", " ")} · ${firmen.length} Firmen · ${firmen.reduce((a, f) => a + f.seiten.length, 0)} Seiten · Auswertung: ${D.modus}`;

const ANSICHTEN = {
  "Übersicht": uebersicht, "Keywords": keywords, "Themen": themen, "Call to Action": cta, "Belege": belege,
  "EU vs. USA": euUsa, "Lücken für Threedy": luecken, "Änderungen": aenderungen, "News": news, "Quellen": quellen,
};
let aktiv = location.hash.slice(1) ? decodeURIComponent(location.hash.slice(1)) : "Übersicht";
function zeige(name) {
  aktiv = ANSICHTEN[name] ? name : "Übersicht"; location.hash = encodeURIComponent(aktiv);
  $("#nav").replaceChildren(...Object.keys(ANSICHTEN).map((n) => el("button", { class: n === aktiv ? "an" : null, onclick: () => zeige(n) }, n)));
  const m = $("#inhalt"); m.replaceChildren();
  if (D.modus.startsWith("Ersatz")) m.append(el("div", { class: "hinweis" }, "Ersatzmodus ohne KI: Keywords und Themen sind nur grob per Stichwortsuche ermittelt. Mit dem GWDG-Schlüssel wertet die KI jede Seite genau aus."));
  ANSICHTEN[aktiv](m);
}

function uebersicht(m) {
  if (D.zusammenfassung) m.append(el("div", { class: "karte md", style: "margin-bottom:14px" }, ...md(D.zusammenfassung)));
  const r = el("div", { class: "raster" });
  for (const f of firmen) {
    const top = Object.entries(f.themen).sort((a, b) => b[1] - a[1]).slice(0, 5);
    r.append(el("div", { class: "karte" },
      el("h3", {}, f.name, " ", region(f.region), f.referenz ? el("span", { class: "ref" }, "Referenz") : null),
      el("div", { class: "klein" }, `${f.seiten.length} Seiten · Stand ${f.stand} · `, el("a", { href: f.start, target: "_blank" }, "Website")),
      f.hauptbotschaften[0] ? el("p", { style: "margin:8px 0 4px;font-weight:500" }, "„" + f.hauptbotschaften[0] + "“") : null,
      el("div", { class: "tags" }, ...top.map(([t]) => el("span", { class: "tag" }, THEMA(t)))),
      el("div", { class: "tags" }, ...f.keywords.slice(0, 8).map(([k]) => el("span", { class: "tag", style: "background:#F3F4F7" }, k)))));
  }
  m.append(r);
}

function keywords(m) {
  const filter = el("input", { type: "search", placeholder: "Keyword suchen …" });
  const tab = el("div", { class: "tabwrap" });
  const zaehler = {};
  for (const f of firmen) for (const [k, n] of f.keywords) (zaehler[k] ||= {}).__ = 0, zaehler[k][f.name] = n;
  const zeilen = Object.keys(zaehler).map((k) => ({ k, firmen: firmen.filter((f) => zaehler[k][f.name]).length })).sort((a, b) => b.firmen - a.firmen || a.k.localeCompare(b.k));
  function render() {
    const q = filter.value.toLowerCase();
    tab.replaceChildren(el("table", {}, el("tr", {}, el("th", {}, "Keyword"), el("th", {}, "Firmen"), ...firmen.map((f) => el("th", {}, f.name))),
      ...zeilen.filter((z) => z.k.includes(q)).slice(0, 150).map((z) => el("tr", {}, el("td", {}, z.k), el("td", { class: "zelle" }, z.firmen),
        ...firmen.map((f) => el("td", { class: "zelle", style: zaehler[z.k][f.name] ? `background:${f.region === "EU" ? "#E4ECFD" : "#FCE7DE"}` : null }, zaehler[z.k][f.name] ? "●" : ""))))));
  }
  filter.addEventListener("input", render); render();
  m.append(el("h2", {}, "Keyword-Tracker"), el("p", { class: "klein" }, "Welche Begriffe auf welchen Seiten vorkommen. Blau = EU-Firma, orange = US-Firma."), filter, el("div", { style: "height:10px" }), tab);
}

function themen(m) {
  const max = Math.max(1, ...firmen.flatMap((f) => Object.values(f.themen)));
  m.append(el("h2", {}, "Themen-Tracker"), el("p", { class: "klein" }, "Wie oft ein Thema auf den Seiten einer Firma vorkommt (Anzahl Seiten)."),
    el("div", { class: "tabwrap" }, el("table", {}, el("tr", {}, el("th", {}, "Thema"), ...firmen.map((f) => el("th", {}, f.name))),
      ...D.themenliste.map((t) => el("tr", {}, el("td", {}, THEMA(t)), ...firmen.map((f) => {
        const n = f.themen[t] || 0;
        return el("td", { class: "zelle", style: n ? `background:rgba(47,111,235,${0.12 + 0.6 * n / max})` : null }, n || "");
      }))))));
}

function cta(m) {
  m.append(el("h2", {}, "Call to Action"), el("p", { class: "klein" }, "Wozu die Seiten auffordern."));
  const r = el("div", { class: "raster" });
  for (const f of firmen) {
    const ges = Object.values(f.cta_typen).reduce((a, b) => a + b, 0) || 1;
    r.append(el("div", { class: "karte" }, el("h3", {}, f.name, " ", region(f.region)),
      ...Object.entries(f.cta_typen).sort((a, b) => b[1] - a[1]).map(([t, n]) => el("div", { class: "balken" }, el("span", { style: "width:110px" }, t.replace("_", " ")),
        el("span", { class: "spur" }, el("i", { style: `width:${100 * n / ges}%;background:var(--akzent)` })), el("span", {}, n))),
      el("div", { class: "tags" }, ...[...new Set(f.seiten.flatMap((p) => p.ctas))].slice(0, 10).map((c) => el("span", { class: "tag" }, c)))));
  }
  m.append(r);
}

function belege(m) {
  m.append(el("h2", {}, "Belege, Kunden und Branchen"));
  const r = el("div", { class: "raster" });
  for (const f of firmen) r.append(el("div", { class: "karte" }, el("h3", {}, f.name, " ", region(f.region)),
    f.kunden.length ? el("div", {}, el("strong", {}, "Kunden: "), f.kunden.join(", ")) : null,
    f.branchen.length ? el("div", {}, el("strong", {}, "Branchen: "), f.branchen.join(", ")) : null,
    el("ul", { style: "margin:6px 0 0;padding-left:18px" }, ...(f.belege.length ? f.belege.slice(0, 8).map((b) => el("li", {}, b)) : [el("li", { class: "leer" }, "keine Belege erfasst")]))));
  m.append(r);
}

function euUsa(m) {
  const gruppe = { EU: firmen.filter((f) => f.region === "EU" && !f.referenz), USA: firmen.filter((f) => f.region === "USA") };
  const anteil = (g, t) => g.length ? g.filter((f) => f.themen[t]).length / g.length : 0;
  m.append(el("h2", {}, "EU vs. USA"), el("p", { class: "klein" }, `Anteil der Firmen je Region, die ein Thema nutzen (EU ohne Threedy: ${gruppe.EU.length}, USA: ${gruppe.USA.length}).`));
  const k = el("div", { class: "karte" });
  for (const t of D.themenliste) {
    const eu = anteil(gruppe.EU, t), us = anteil(gruppe.USA, t);
    if (!eu && !us) continue;
    k.append(el("div", { class: "balken" }, el("span", { style: "width:170px" }, THEMA(t)),
      el("span", { class: "spur" }, el("i", { style: `width:${50 * eu}%;background:var(--eu)` })), el("span", { style: "width:34px" }, Math.round(eu * 100) + "%"),
      el("span", { class: "spur" }, el("i", { style: `width:${50 * us}%;background:var(--us)` })), el("span", { style: "width:34px" }, Math.round(us * 100) + "%")));
  }
  m.append(el("div", { class: "klein", style: "margin-bottom:6px" }, region("EU"), " links · ", region("USA"), " rechts"), k);
  // Regionale Seitenversionen derselben Firma
  const mehr = firmen.filter((f) => new Set(f.seiten.map((p) => p.sprache || p.region)).size > 1);
  if (mehr.length) {
    m.append(el("h2", { style: "margin-top:20px" }, "Gleiche Firma, andere Sprache"));
    for (const f of mehr) m.append(el("div", { class: "karte", style: "margin-bottom:10px" }, el("h3", {}, f.name),
      ...f.seiten.map((p) => el("div", { class: "klein" }, el("strong", {}, `${(p.sprache || "?").toUpperCase()}: `), p.hauptbotschaft || p.titel))));
  }
}

function luecken(m) {
  m.append(el("h2", {}, "Lücken für Threedy"), el("p", { class: "klein" }, "Themen und Keywords, die mindestens zwei Wettbewerber nutzen, Threedy auf seinen erfassten Seiten aber nicht."));
  const r = el("div", { class: "raster" });
  r.append(el("div", { class: "karte" }, el("h3", {}, "Themen"), ...(D.luecken.themen.length ? D.luecken.themen.map((x) => el("div", { class: "balken" }, el("span", { style: "flex:1" }, THEMA(x.thema)), el("strong", {}, `${x.firmen} Firmen`))) : [el("p", { class: "leer" }, "keine")])));
  r.append(el("div", { class: "karte" }, el("h3", {}, "Keywords"), ...(D.luecken.keywords.length ? D.luecken.keywords.map((x) => el("div", { class: "balken" }, el("span", { style: "flex:1" }, x.keyword), el("strong", {}, `${x.firmen} Firmen`))) : [el("p", { class: "leer" }, "keine")])));
  m.append(r);
}

function aenderungen(m) {
  m.append(el("h2", {}, "Änderungsprotokoll"));
  if (!D.aenderungen.length) { m.append(el("p", { class: "leer" }, "Noch keine Änderungen.")); return; }
  m.append(el("div", { class: "tabwrap" }, el("table", {}, el("tr", {}, el("th", {}, "Datum"), el("th", {}, "Firma"), el("th", {}, "Art"), el("th", {}, "Seite"), el("th", {}, "Details")),
    ...D.aenderungen.map((a) => el("tr", {}, el("td", {}, a.datum), el("td", {}, a.firma), el("td", {}, a.art), el("td", {}, el("a", { href: a.url, target: "_blank" }, a.url.replace(/^https?:\/\//, "").slice(0, 60))),
      el("td", {}, ...(a.neue_ueberschriften || []).map((u) => el("div", { style: "color:var(--gut)" }, "+ " + u)), ...(a.entfernte_ueberschriften || []).map((u) => el("div", { style: "color:#B54" }, "− " + u))))))));
}

function news(m) {
  m.append(el("h2", {}, "News"), el("p", { class: "klein" }, "Aktuelle Artikel aus Google News, getrennt nach EU (deutsch) und USA (englisch)."));
  const r = el("div", { class: "raster" });
  for (const f of firmen) r.append(el("div", { class: "karte" }, el("h3", {}, f.name),
    ...(f.news.length ? f.news.slice(0, 8).map((n) => el("div", { style: "margin:6px 0" }, region(n.region), " ", el("a", { href: n.link, target: "_blank" }, n.titel), el("div", { class: "klein" }, `${n.quelle} · ${n.datum}`))) : [el("p", { class: "leer" }, "keine Artikel")])));
  m.append(r);
}

function quellen(m) {
  m.append(el("h2", {}, "Erfasste Quellen"));
  if (D.fehler.length) m.append(el("div", { class: "hinweis" }, el("strong", {}, `${D.fehler.length} Seiten konnten nicht abgerufen werden: `), ...D.fehler.map((x) => el("div", {}, `${x.firma}: ${x.url} · ${x.fehler}`))));
  m.append(el("div", { class: "tabwrap" }, el("table", {}, el("tr", {}, el("th", {}, "Firma"), el("th", {}, "Region"), el("th", {}, "Seite"), el("th", {}, "Typ"), el("th", {}, "Sprache"), el("th", {}, "Stand")),
    ...firmen.flatMap((f) => f.seiten.map((p) => el("tr", {}, el("td", {}, f.name), el("td", {}, region(p.region)), el("td", {}, el("a", { href: p.url, target: "_blank" }, p.titel || p.url)), el("td", {}, p.seitentyp), el("td", {}, p.sprache), el("td", {}, p.datum)))))));
}

function md(text) {
  const out = []; let ul = null;
  for (const z of text.split("\n")) {
    const t = z.trim(); if (!t) { ul = null; continue; }
    if (t.startsWith("## ")) { ul = null; out.push(el("h2", {}, t.slice(3))); }
    else if (/^[-*] /.test(t)) { if (!ul) { ul = el("ul"); out.push(ul); } ul.append(el("li", {}, t.slice(2).replace(/\*\*/g, ""))); }
    else { ul = null; out.push(el("p", {}, t.replace(/\*\*/g, ""))); }
  }
  return out;
}
addEventListener("hashchange", () => { const n = decodeURIComponent(location.hash.slice(1)); if (n !== aktiv) zeige(n); });
zeige(aktiv);
</script>
</body>
</html>
